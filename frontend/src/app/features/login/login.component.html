<!-- src/app/features/login/login.component.html -->
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div style="background:#0F2D6E; border-radius:14px; padding:10px; display:inline-flex; margin-bottom:10px;">
        <img src="assets/logo-esueldos.png"
             alt="e-Sueldos" style="height:52px; width:auto; object-fit:contain;">
      </div>
      <h1>Agente LSD</h1>
      <p class="subtitle">Validador de Libro de Sueldo Digital &mdash; <strong>e-Sueldos</strong></p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form" id="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Ingresá tu usuario"
          autocomplete="username"
        />
        <span class="field-error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          El usuario es requerido.
        </span>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <span class="field-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          La contraseña es requerida.
        </span>
      </div>

      <div class="error-banner" *ngIf="error">
        ⚠️ {{ error }}
      </div>

      <button
        id="btn-login"
        type="submit"
        class="btn-primary"
        [disabled]="cargando || form.invalid"
      >
        <span *ngIf="!cargando">Ingresar</span>
        <span *ngIf="cargando" class="spinner">Ingresando...</span>
      </button>
    </form>

    <p class="footer-note">e-Sueldos · Sistema interno</p>
  </div>
</div>
